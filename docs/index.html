<!doctype html>
<html lang="en" data-face="minimal" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f0">
  <title>Spencer Family Cookbook</title>
  <meta name="description" content="The searchable Spencer family recipe collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Spencer Family Cookbook home">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span><strong>Spencer</strong><small>Family Cookbook</small></span>
    </a>
    <nav class="primary-nav" aria-label="Cookbook links">
      <button id="surprise" type="button">Surprise me</button>
      <a href="cookbook.pdf" target="_blank">Original book</a>
      <a href="https://github.com/hyperlimn/Spencer.Family.Cookbook" target="_blank">Contribute</a>
    </nav>
  </header>

  <main>
    <section class="tools" aria-label="Search and appearance">
      <form class="search" id="search-form" role="search">
        <span aria-hidden="true">⌕</span>
        <label class="sr-only" for="search-input">Search recipes</label>
        <input id="search-input" type="search" placeholder="Search recipes, ingredients, or contributors" autocomplete="off">
        <button id="clear-search" type="button" aria-label="Clear search" hidden>Clear</button>
        <kbd>/</kbd>
      </form>
      <div class="appearance">
        <label>Face
          <select id="face-select" aria-label="Choose site face">
            <option value="minimal">Minimal</option>
            <option value="classic">Classic</option>
          </select>
        </label>
        <label class="check"><input id="dark-mode" type="checkbox"> Dark mode</label>
      </div>
    </section>

    <section class="catalog" aria-label="Recipe catalog">
      <aside class="sidebar">
        <div class="sidebar-heading"><span>Browse</span><button id="clear-filters" type="button">Reset</button></div>
        <div id="categories" class="filters"></div>
        <details>
          <summary>Contributors</summary>
          <div id="contributors" class="filters contributor-list"></div>
        </details>
        <label class="check review"><input type="checkbox" id="review-only"> Needs review</label>
      </aside>

      <section class="results">
        <header class="results-heading">
          <div><h1 id="result-title">All recipes</h1><p id="result-context">The complete family collection</p></div>
          <span id="count" aria-live="polite">Loading…</span>
        </header>
        <div id="recipe-grid" class="recipe-grid" aria-live="polite"></div>
        <div id="empty" class="empty" hidden><span aria-hidden="true">✽</span><h2>No recipes found</h2><p>Try another word or reset your filters.</p></div>
      </section>
    </section>
  </main>

  <dialog id="recipe-dialog"><article id="recipe-detail"></article></dialog>
  <footer><span>From Kathy’s collection.</span><span id="collection-stats"></span></footer>
  <script src="app.js" defer></script>
</body>
</html>
